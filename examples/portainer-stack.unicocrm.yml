version: "3.7"

services:
  pgvector:
    image: ankane/pgvector:latest
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - ${STACK_NETWORK:-UnicoNet}
    environment:
      - POSTGRES_DB=${POSTGRES_DATABASE:-chatwoot}
      - POSTGRES_USER=${POSTGRES_USERNAME:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?configure_POSTGRES_PASSWORD}
    deploy:
      placement:
        constraints:
          - node.role == manager

  redis:
    image: redis:latest
    command: ["redis-server", "--appendonly", "yes", "--port", "6379"]
    volumes:
      - redis_data:/data
    networks:
      - ${STACK_NETWORK:-UnicoNet}
    deploy:
      placement:
        constraints:
          - node.role == manager

  app:
    image: delvechiotech/unicocrm:latest
    entrypoint: docker/entrypoints/rails.sh
    command: >
      sh -c "bundle exec rails db:chatwoot_prepare &&
      bundle exec rails s -p 3000 -b 0.0.0.0"
    volumes:
      - storage:/app/storage
    networks:
      - ${STACK_NETWORK:-UnicoNet}
    environment:
      - INSTALLATION_NAME=${INSTALLATION_NAME:-UnicoCRM}
      - CHATWOOT_EDITION=enterprise
      - CW_ENABLE_ENTERPRISE=true
      - INSTALLATION_PRICING_PLAN=enterprise
      - DISABLE_TELEMETRY=true
      - FRONTEND_URL=${FRONTEND_URL:?configure_FRONTEND_URL}
      - FORCE_SSL=${FORCE_SSL:-true}
      - SECRET_KEY_BASE=${SECRET_KEY_BASE:?configure_SECRET_KEY_BASE}
      - DEFAULT_LOCALE=${DEFAULT_LOCALE:-pt_BR}
      - TZ=${TZ:-America/Sao_Paulo}
      - REDIS_URL=redis://redis:6379
      - POSTGRES_HOST=pgvector
      - POSTGRES_USERNAME=${POSTGRES_USERNAME:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?configure_POSTGRES_PASSWORD}
      - POSTGRES_DATABASE=${POSTGRES_DATABASE:-chatwoot}
      - POSTGRES_PORT=5432
      - ACTIVE_STORAGE_SERVICE=local
      - RAILS_ENV=production
      - NODE_ENV=production
      - INSTALLATION_ENV=docker
      - RAILS_LOG_TO_STDOUT=true
      - QUEPASA_API_URL=${QUEPASA_API_URL:?configure_QUEPASA_API_URL}
      - QUEPASA_MASTER_KEY=${QUEPASA_MASTER_KEY:?configure_QUEPASA_MASTER_KEY}
      - SMTP_ADDRESS=${SMTP_ADDRESS}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_AUTHENTICATION=${SMTP_AUTHENTICATION:-login}
      - SMTP_ENABLE_STARTTLS_AUTO=${SMTP_ENABLE_STARTTLS_AUTO:-true}
      - MAILER_SENDER_EMAIL=${MAILER_SENDER_EMAIL}
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      labels:
        - traefik.enable=true
        - traefik.http.routers.unicocrm.rule=Host(`${CRM_DOMAIN:?configure_CRM_DOMAIN}`)
        - traefik.http.routers.unicocrm.entrypoints=websecure
        - traefik.http.routers.unicocrm.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-letsencryptresolver}
        - traefik.http.services.unicocrm.loadbalancer.server.port=3000

  sidekiq:
    image: delvechiotech/unicocrm:latest
    command: bundle exec sidekiq -C config/sidekiq.yml
    volumes:
      - storage:/app/storage
    networks:
      - ${STACK_NETWORK:-UnicoNet}
    environment:
      - INSTALLATION_NAME=${INSTALLATION_NAME:-UnicoCRM}
      - SECRET_KEY_BASE=${SECRET_KEY_BASE:?configure_SECRET_KEY_BASE}
      - FRONTEND_URL=${FRONTEND_URL:?configure_FRONTEND_URL}
      - FORCE_SSL=${FORCE_SSL:-true}
      - REDIS_URL=redis://redis:6379
      - POSTGRES_HOST=pgvector
      - POSTGRES_USERNAME=${POSTGRES_USERNAME:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?configure_POSTGRES_PASSWORD}
      - POSTGRES_DATABASE=${POSTGRES_DATABASE:-chatwoot}
      - ACTIVE_STORAGE_SERVICE=local
      - RAILS_ENV=production
      - NODE_ENV=production
      - RAILS_LOG_TO_STDOUT=true
      - QUEPASA_API_URL=${QUEPASA_API_URL:?configure_QUEPASA_API_URL}
      - QUEPASA_MASTER_KEY=${QUEPASA_MASTER_KEY:?configure_QUEPASA_MASTER_KEY}
      - SMTP_ADDRESS=${SMTP_ADDRESS}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_AUTHENTICATION=${SMTP_AUTHENTICATION:-login}
      - SMTP_ENABLE_STARTTLS_AUTO=${SMTP_ENABLE_STARTTLS_AUTO:-true}
      - MAILER_SENDER_EMAIL=${MAILER_SENDER_EMAIL}
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager

volumes:
  storage:
  redis_data:
  pg_data:

networks:
  UnicoNet:
    external: true
